<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MONRail - Client</title>
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .autocomplete-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ccc; max-height: 150px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
        .autocomplete-list div { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .autocomplete-list div:hover { background: #f0fdf4; color: #059669; }
    </style>
</head>
<body>
<header>
    <a href="#" class="logo">MON<span>Rail</span></a>
    <button class="btn-login" id="auth-btn" onclick="handleAuth()">Connexion</button>
</header>
<div class="container">
    <div class="search-widget">
        <div class="search-input-group" style="position:relative;">
            <input type="text" id="dep-input" placeholder="Départ" autocomplete="off">
            <div id="dep-list" class="autocomplete-list"></div>
        </div>
        <div class="search-input-group" style="position:relative;">
            <input type="text" id="arr-input" placeholder="Arrivée" autocomplete="off">
            <div id="arr-list" class="autocomplete-list"></div>
        </div>
        <div class="search-input-group" style="flex:0.5;"><input type="date" id="date-input"></div>
        <button class="btn-search" onclick="searchTrains()">Chercher</button>
    </div>

    <div id="results-container"></div>
</div>

<script>
    const db = window.supabase.createClient('https://bzlzjyktulpplftqdmvn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA');
    let stations = [];

    async function init() {
        const { data } = await db.from('stations').select('*');
        stations = data || [];
        document.getElementById('date-input').valueAsDate = new Date();
        
        setupAutocomplete(document.getElementById('dep-input'), document.getElementById('dep-list'));
        setupAutocomplete(document.getElementById('arr-input'), document.getElementById('arr-list'));
    }
    init();

    function setupAutocomplete(input, list) {
        input.addEventListener('input', () => {
            const val = input.value.toLowerCase();
            list.innerHTML = '';
            if(!val) return list.style.display = 'none';
            const matches = stations.filter(s => s.name.toLowerCase().includes(val));
            list.style.display = matches.length ? 'block' : 'none';
            matches.forEach(s => {
                const div = document.createElement('div'); div.innerText = s.name;
                div.onclick = () => { input.value = s.name; input.dataset.id = s.id; list.style.display = 'none'; };
                list.appendChild(div);
            });
        });
    }

    async function searchTrains() {
        const depId = document.getElementById('dep-input').dataset.id;
        const arrId = document.getElementById('arr-input').dataset.id;
        const dateVal = document.getElementById('date-input').value;
        if(!depId || !arrId || !dateVal) return alert('Sélectionnez les gares dans les suggestions.');
        
        const startOfDay = new Date(dateVal); startOfDay.setHours(0,0,0,0);
        const endOfDay = new Date(dateVal); endOfDay.setHours(23,59,59,999);
        const resContainer = document.getElementById('results-container');
        resContainer.innerHTML = '<p>Recherche...</p>';

        // Recherche les lignes qui correspondent au départ/arrivée
        const { data: matchingLines } = await db.from('lines').select('id').eq('departure_station_id', depId).eq('arrival_station_id', arrId);
        if(!matchingLines || matchingLines.length === 0) return resContainer.innerHTML = '<p>Aucune ligne directe trouvée.</p>';
        
        const lineIds = matchingLines.map(l => l.id);
        const { data } = await db.from('journeys').select('*, lines(*)').in('line_id', lineIds)
            .gte('departure_date', startOfDay.toISOString()).lte('departure_date', endOfDay.toISOString()).order('departure_date');

        resContainer.innerHTML = '';
        if(!data || data.length === 0) return resContainer.innerHTML = '<p>Aucun train prévu à cette date.</p>';

        data.forEach(j => {
            const depDate = new Date(j.departure_date);
            const arrDate = new Date(depDate.getTime() + (120 * 60000) + (j.delay_minutes * 60000));
            
            let statusHtml = j.status === 'cancelled' ? `<div style="color:red; font-weight:bold;">SUPPRIMÉ: ${j.motif}</div>` : (j.status === 'delayed' ? `<div style="color:orange; font-weight:bold;">RETARD +${j.delay_minutes}m: ${j.motif}</div>` : '');
            
            let stopsHtml = '';
            const stops = JSON.parse(j.lines.stops || '[]');
            stops.forEach(st => {
                let stopTime = new Date(depDate.getTime() + (st.offset * 60000));
                stopsHtml += `<div class="track-stop"><div class="track-dot" style="border-color:#ccc;"></div>${stopTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>${st.name}</div>`;
            });

            resContainer.innerHTML += `
                <div class="result-card" style="${j.status === 'cancelled' ? 'opacity:0.6;' : ''}">
                    ${statusHtml}
                    <div class="result-card-header" style="display:flex; width:100%; align-items:center;">
                        <div class="train-badge badge-tgv">${j.lines.train_type} <br><small>N°${j.lines.train_number}</small></div>
                        <div class="journey-times">
                            <div class="time-row"><span class="time-val">${depDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span><span class="station-val">${document.getElementById('dep-input').value}</span></div>
                            <div class="time-row"><span class="time-val">${arrDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span><span class="station-val">${document.getElementById('arr-input').value}</span></div>
                        </div>
                        <div class="price-block"><span class="price-val">${j.lines.base_price} €</span><button class="btn-book">Réserver</button></div>
                    </div>
                    <div class="timeline-track" style="width:100%; margin-top:20px; padding-top:20px; border-top:1px solid #eee; display:flex; justify-content:space-between;">
                        <div class="track-stop"><div class="track-dot"></div>DÉPART<br>${document.getElementById('dep-input').value}</div>
                        ${stopsHtml}
                        <div class="track-stop"><div class="track-dot end"></div>ARRIVÉE<br>${document.getElementById('arr-input').value}</div>
                    </div>
                </div>`;
        });
    }
    function handleAuth() { alert("Connecté."); }
</script>
</body>
</html>`
