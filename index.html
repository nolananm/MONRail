<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MONRail - Client</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
    <a href="#" class="logo">MON<span>Rail</span></a>
    <button class="btn-login" id="auth-btn" onclick="handleAuth()">Connexion</button>
</header>
<div class="container">
    <div id="error-log" style="color:red; text-align:center;"></div>
    
    <div class="search-widget">
        <div class="search-input-group"><input type="text" id="dep-input" placeholder="Départ" onkeyup="searchStation(this, 'dep-list')"><div id="dep-list" class="autocomplete-list"></div></div>
        <div class="search-input-group"><input type="text" id="arr-input" placeholder="Arrivée" onkeyup="searchStation(this, 'arr-list')"><div id="arr-list" class="autocomplete-list"></div></div>
        <div class="search-input-group" style="flex:0.5;"><input type="date" id="date-input"></div>
        <button class="btn-search" onclick="searchTrains()">Chercher</button>
    </div>

    <div id="results-container"></div>

    <div class="board-container" id="horaires-gare" style="margin-top:60px;">
        <div class="board-header">
            <h2>Horaires en gare (10 prochains trains)</h2>
            <div style="position:relative;">
                <input type="text" id="board-input" placeholder="Saisir la gare..." onkeyup="searchBoardStation()">
                <div id="board-list" class="autocomplete-list" style="color:black;"></div>
            </div>
        </div>
        <table class="board-table">
            <thead><tr><th>Heure</th><th>Train</th><th>Direction/Provenance</th><th>Statut</th></tr></thead>
            <tbody id="board-body"><tr><td colspan="4" style="text-align:center;">Sélectionnez une gare.</td></tr></tbody>
        </table>
    </div>
</div>

<script>
    const db = window.supabase.createClient('https://bzlzjyktulpplftqdmvn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA');

    let stations = [], fakeUser = localStorage.getItem('monrail_user');
    if(fakeUser) document.getElementById('auth-btn').innerText = fakeUser.split('@')[0];

    async function init() {
        try {
            const { data, error } = await db.from('stations').select('*');
            if(error) throw error;
            stations = data || [];
            document.getElementById('date-input').valueAsDate = new Date();
        } catch(err) { document.getElementById('error-log').innerText = "Connexion DB échouée."; }
    }
    init();

    function getStationName(id) { const s = stations.find(x => x.id === id); return s ? s.name : 'Inconnu'; }
    function forceGetStationId(input) { return input.dataset.id || (stations.find(s => s.name.toLowerCase() === input.value.toLowerCase())?.id); }

    function searchStation(inputEle, listId) {
        const val = inputEle.value.toLowerCase(), list = document.getElementById(listId);
        list.innerHTML = '';
        if(!val) { list.style.display = 'none'; return; }
        const matches = stations.filter(s => s.name.toLowerCase().includes(val));
        list.style.display = matches.length ? 'block' : 'none';
        matches.forEach(s => {
            const div = document.createElement('div'); div.innerText = s.name;
            div.onclick = () => { inputEle.value = s.name; inputEle.dataset.id = s.id; list.style.display = 'none'; };
            list.appendChild(div);
        });
    }

    async function searchTrains() {
        try {
            const depId = forceGetStationId(document.getElementById('dep-input'));
            const arrId = forceGetStationId(document.getElementById('arr-input'));
            const dateVal = document.getElementById('date-input').value;
            
            if(!depId || !arrId || !dateVal) return alert('Gares ou date invalides.');
            
            const startOfDay = new Date(dateVal); startOfDay.setHours(0,0,0,0);
            const endOfDay = new Date(dateVal); endOfDay.setHours(23,59,59,999);

            const resContainer = document.getElementById('results-container');
            resContainer.innerHTML = '<p>Recherche...</p>';

            const { data, error } = await db.from('journeys')
                .select('*, lines(*)')
                .eq('departure_station_id', depId).eq('arrival_station_id', arrId)
                .gte('departure_date', startOfDay.toISOString())
                .lte('departure_date', endOfDay.toISOString())
                .order('departure_date', { ascending: true });

            if(error) throw error;
            resContainer.innerHTML = '';

            if(!data || data.length === 0) return resContainer.innerHTML = '<p>Aucun train trouvé.</p>';

            data.forEach(j => {
                let finalPrice = j.lines.base_price;
                if(j.lines.price_type === 'dynamic') {
                    const daysDiff = (new Date(j.departure_date) - new Date()) / (1000 * 3600 * 24);
                    if(daysDiff < j.lines.days_before_change) finalPrice = j.lines.late_price;
                }

                const depDate = new Date(j.departure_date);
                const arrDate = new Date(depDate.getTime() + (90 * 60000) + (j.delay_minutes * 60000));
                
                let isCancelled = j.status === 'cancelled';
                let statusHtml = '';
                if(isCancelled) statusHtml = `<div style="color:var(--primary-red); font-weight:bold; margin-bottom:10px;">SUPPRIMÉ - Motif: ${j.motif || 'Non précisé'}</div>`;
                else if(j.status === 'delayed') statusHtml = `<div style="color:#f59e0b; font-weight:bold; margin-bottom:10px;">RETARD +${j.delay_minutes}min - Motif: ${j.motif || 'Incident'}</div>`;

                let addedStopsHtml = '';
                let addedIds = JSON.parse(j.added_stations || '[]');
                addedIds.forEach(id => addedStopsHtml += `<div class="track-stop" style="color:var(--primary-green);"><div class="track-dot" style="border-color:var(--primary-green);"></div>Arrêt Exceptionnel<br>${getStationName(id)}</div>`);

                resContainer.innerHTML += `
                    <div class="result-card" style="${isCancelled ? 'opacity:0.6; pointer-events:none;' : ''}">
                        ${statusHtml}
                        <div class="result-card-header" style="display:flex; width:100%; align-items:center;">
                            <div class="train-badge badge-tgv">${j.lines.train_type} <br><small>N°${j.lines.train_number}</small><br>${j.lines.is_exceptional ? '<span style="color:red">Excep.</span>' : ''}</div>
                            <div class="journey-times">
                                <div class="time-row"><span class="time-val" style="${isCancelled ? 'text-decoration:line-through' : ''}">${depDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span><span class="station-val">${getStationName(depId)}</span></div>
                                <div class="time-row"><span class="time-val" style="${isCancelled ? 'text-decoration:line-through' : ''}">${arrDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span><span class="station-val">${getStationName(arrId)}</span></div>
                            </div>
                            <div class="price-block">
                                <span class="price-val">${finalPrice} €</span>
                                <button class="btn-book" onclick="alert('Billet de ${finalPrice}€ enregistré.')">Réserver</button>
                            </div>
                        </div>
                        <div class="timeline-track" style="width:100%;">
                            <div class="track-stop"><div class="track-dot"></div>DÉPART<br>${getStationName(depId)}</div>
                            ${addedStopsHtml}
                            <div class="track-stop"><div class="track-dot end"></div>ARRIVÉE<br>${getStationName(arrId)}</div>
                        </div>
                    </div>
                `;
            });
        } catch(err) { resContainer.innerHTML = '<p>Erreur: ' + err.message + '</p>'; }
    }

    function searchBoardStation() {
        searchStation(document.getElementById('board-input'), 'board-list');
        document.getElementById('board-list').querySelectorAll('div').forEach(div => {
            const oldClick = div.onclick;
            div.onclick = () => { oldClick(); loadStationBoard(document.getElementById('board-input').dataset.id); }
        });
    }

    async function loadStationBoard(stationId) {
        if(!stationId) return;
        const tbody = document.getElementById('board-body');
        tbody.innerHTML = '<tr><td colspan="4">Chargement...</td></tr>';
        
        try {
            const now = new Date();
            const in10Hours = new Date(now.getTime() + (10 * 3600 * 1000));

            const { data, error } = await db.from('journeys')
                .select('*, lines(*)')
                .or(`departure_station_id.eq.${stationId},arrival_station_id.eq.${stationId}`)
                .gte('departure_date', now.toISOString())
                .lte('departure_date', in10Hours.toISOString())
                .order('departure_date', { ascending: true })
                .limit(10);

            if(error) throw error;
            tbody.innerHTML = '';
            
            if(!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="4">Aucun train prévu dans les 10 prochaines heures.</td></tr>';

            data.forEach(j => {
                const isDeparture = j.departure_station_id === stationId;
                const time = new Date(j.departure_date);
                const direction = isDeparture ? `Vers ${getStationName(j.arrival_station_id)}` : `En provenance de ${getStationName(j.departure_station_id)}`;
                
                let status = j.status === 'delayed' ? `<span style="color:#f59e0b">Retard (${j.motif})</span>` : (j.status === 'cancelled' ? `<span style="color:red">Supprimé (${j.motif})</span>` : `<span style="color:green">À l'heure</span>`);
                
                tbody.innerHTML += `<tr><td>${time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${j.lines.train_type}</td><td>${direction}</td><td>${status}</td></tr>`;
            });
        } catch(err) { tbody.innerHTML = `<tr><td colspan="4">Erreur: ${err.message}</td></tr>`; }
    }

    function handleAuth() {
        const email = prompt("Email de connexion:");
        if(email) { localStorage.setItem('monrail_user', email); location.reload(); }
    }
</script>
</body>
</html>
