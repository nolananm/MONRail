<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONRail - Réservez vos billets de train</title>
    <!-- Le "?v=2" force le navigateur à télécharger la nouvelle version du CSS -->
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header>
    <div style="display: flex; align-items: center; gap: 40px;">
        <a href="#" class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="4" y="9" width="16" height="6"></rect><line x1="10" y1="4" x2="10" y2="20"></line></svg>
            MON<span>Rail</span>
        </a>
        <div class="nav-links">
            <a href="#">Voyager</a>
            <a href="#">Cartes et abonnements</a>
            <a href="#">Services</a>
        </div>
    </div>
    <div class="nav-actions">
        <a href="#">Aide</a>
        <a href="#">Vos billets</a>
        <button class="btn-login" onclick="login()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Se connecter
        </button>
    </div>
</header>

<div class="container">
    <h1 class="hero-title">Trains, bus, transports en commun : trouvez facilement votre trajet</h1>

    <div class="search-widget-container">
        <div class="search-widget">
            <div class="search-input-group">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="margin-left:10px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="dep-input" placeholder="Gare de départ..." onkeyup="searchStation(this, 'dep-list')">
                <div id="dep-list" class="autocomplete-list"></div>
            </div>
            <div class="search-input-group">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="margin-left:10px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <input type="text" id="arr-input" placeholder="Gare d'arrivée..." onkeyup="searchStation(this, 'arr-list')">
                <div id="arr-list" class="autocomplete-list"></div>
            </div>
            <div class="search-input-group" style="flex: 0.7;">
                <input type="date" id="date-input">
            </div>
            <button class="btn-search" onclick="searchTrains()">Rechercher</button>
        </div>
    </div>

    <div class="promo-banner" id="promo-banner">
        <div class="promo-content">
            <h3>Embarquez pour le Festival MONRail !</h3>
            <p>Réservez dès maintenant votre trajet en train à travers le pays.</p>
        </div>
    </div>

    <div id="results-header" class="results-header"></div>
    <div id="results-container"></div>
</div>

<script>
    const SUPABASE_URL = 'https://bzlzjyktulpplftqdmvn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let stations = [];
    
    async function loadStations() {
        let { data } = await supabase.from('stations').select('*');
        stations = data || [];
    }
    loadStations();

    function searchStation(inputEle, listId) {
        const val = inputEle.value.toLowerCase();
        const list = document.getElementById(listId);
        list.innerHTML = '';
        if (!val) return;
        
        const matches = stations.filter(s => s.name.toLowerCase().includes(val));
        matches.forEach(s => {
            const div = document.createElement('div');
            div.innerText = s.name;
            div.onclick = () => {
                inputEle.value = s.name;
                inputEle.dataset.id = s.id;
                list.innerHTML = '';
            };
            list.appendChild(div);
        });
    }

    async function searchTrains() {
        const depInput = document.getElementById('dep-input');
        const arrInput = document.getElementById('arr-input');
        const depId = depInput.dataset.id;
        const arrId = arrInput.dataset.id;
        const resContainer = document.getElementById('results-container');
        const resHeader = document.getElementById('results-header');
        
        if (!depId || !arrId) {
            alert('Veuillez sélectionner des gares valides dans la liste.');
            return;
        }

        document.getElementById('promo-banner').style.display = 'none';
        resHeader.innerHTML = `Aller : ${depInput.value} - ${arrInput.value}`;
        resContainer.innerHTML = '<p style="text-align:center; padding:40px; font-weight:500;">Recherche de vos billets...</p>';
        
        let { data, error } = await supabase
            .from('journeys')
            .select('*, lines(*)')
            .eq('status', 'on_time');

        resContainer.innerHTML = '';
        if(data && data.length > 0) {
            data.forEach((journey, index) => {
                let badgeClass = 'badge-tgv';
                if(journey.lines.train_type.includes('TER')) badgeClass = 'badge-ter';
                if(journey.lines.train_type.includes('CITÉ')) badgeClass = 'badge-cite';

                const depDate = new Date(journey.departure_date);
                const arrDate = new Date(depDate.getTime() + (90 * 60000));

                resContainer.innerHTML += `
                    <div class="result-card" style="flex-wrap: wrap;">
                        <div class="train-badge ${badgeClass}">${journey.lines.train_type}</div>
                        
                        <div class="journey-times">
                            <div class="time-row">
                                <span class="time-val">${depDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                <span class="station-val">${depInput.value}</span>
                            </div>
                            <div class="time-row">
                                <span class="time-val">${arrDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                <span class="station-val">${arrInput.value}</span>
                            </div>
                        </div>

                        <div class="journey-info">
                            1h30 Direct<br>
                            <a onclick="document.getElementById('details-${index}').style.display='block'">Détail du trajet <span>📍</span></a>
                        </div>

                        <div class="price-block">
                            <span class="price-label">Dès</span>
                            <span class="price-val">${journey.lines.base_price} €</span>
                            <button class="btn-book" onclick="bookTrain('${journey.id}', '${depInput.value}', '${arrInput.value}')">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="float:right; margin-top:4px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </button>
                        </div>

                        <div class="timeline-details" id="details-${index}">
                            <div class="timeline">
                                <div class="timeline-stop"><div class="timeline-dot"></div>${depDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}<br><b>${depInput.value}</b></div>
                                <div class="timeline-stop"><div class="timeline-dot" style="border-color:var(--primary-red)"></div>Gare Intermédiaire</div>
                                <div class="timeline-stop"><div class="timeline-dot"></div>${arrDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}<br><b>${arrInput.value}</b></div>
                            </div>
                            <p style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:20px;">Billet non remboursable, non échangeable.</p>
                        </div>
                    </div>
                `;
            });
        } else {
            resContainer.innerHTML = '<div class="result-card"><p style="margin:0; font-weight:500;">Aucun train trouvé pour ce trajet aujourd\'hui.</p></div>';
        }
    }

    async function login() {
        alert("Redirection vers l'espace de connexion (OAuth GitHub simulé).");
        await supabase.auth.signInWithOAuth({ provider: 'github' });
    }

    async function bookTrain(journeyId, depStation, arrStation) {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            alert('Vous devez vous connecter pour associer un nom au billet.');
            login();
            return;
        }
        
        const numCB = prompt("Paiement Sécurisé MONRail\nEntrez votre numéro de carte bancaire (Test) :");
        if(numCB) {
            document.getElementById('results-header').innerHTML = "Votre réservation est confirmée !";
            const ticketHTML = `
                <div class="admin-card" id="print-ticket" style="text-align:center; max-width:500px; margin: 0 auto;">
                    <h2 style="color:var(--primary-green);">Billet MONRail</h2>
                    <p style="font-size:16px;"><strong>Passager :</strong> ${session.user.email}</p>
                    <p style="font-size:24px; font-weight:800; margin:25px 0;">${depStation} ➔ ${arrStation}</p>
                    <p style="color:var(--text-muted); font-size:14px;">Ce billet est personnel et nominatif. Présentez ce QR Code lors du contrôle.</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${journeyId}" alt="QR Code" style="margin-top:20px; border-radius:10px;">
                </div>
                <div style="text-align:center; margin-top:20px;">
                    <button class="btn-search" style="background:var(--text-dark); color:white; border:none;" onclick="downloadPDF()">Télécharger le Billet (PDF)</button>
                </div>
            `;
            document.getElementById('results-container').innerHTML = ticketHTML;
        }
    }

    function downloadPDF() {
        const element = document.getElementById('print-ticket');
        html2pdf().set({
            margin: 1,
            filename: 'Billet_MONRail.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        }).from(element).save();
    }
</script>
</body>
</html>
