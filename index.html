<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MONRail - Réservation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header>
    <a href="#" class="logo">MON<span>Rail</span></a>
    <div style="display:flex; gap:15px;">
        <button class="btn-login" onclick="openTickets()">Vos billets</button>
        <button class="btn-login" id="auth-btn" onclick="handleAuth()">Se connecter</button>
    </div>
</header>

<div class="container">
    <h1 class="title-main">Trouvez facilement votre trajet</h1>

    <div class="search-widget">
        <div class="input-group">
            <input type="text" id="dep-input" placeholder="Gare de départ" autocomplete="off">
            <div id="dep-list" class="autocomplete-list"></div>
        </div>
        <div class="input-group">
            <input type="text" id="arr-input" placeholder="Gare d'arrivée" autocomplete="off">
            <div id="arr-list" class="autocomplete-list"></div>
        </div>
        <div class="input-group" style="flex: 0.6;">
            <input type="date" id="date-input">
        </div>
        <button class="btn-search" onclick="searchTrains()">Rechercher</button>
    </div>

    <div id="results-container"></div>

    <div class="admin-card" style="margin-top:60px; background:#0f172a; color:white;">
        <h2>Tableau des départs & arrivées (Direct)</h2>
        <div class="input-group" style="max-width:300px; margin-bottom:20px;">
            <input type="text" id="board-input" placeholder="Rechercher une gare..." style="background:rgba(255,255,255,0.1); color:white; border-radius:8px;">
            <div id="board-list" class="autocomplete-list" style="color:black;"></div>
        </div>
        <table style="width:100%; text-align:left; border-collapse:collapse;">
            <thead><tr style="border-bottom:1px solid #334155;"><th style="padding:10px;">Heure</th><th style="padding:10px;">Train</th><th style="padding:10px;">Statut</th></tr></thead>
            <tbody id="board-body"><tr><td colspan="3" style="padding:10px;">Sélectionnez une gare.</td></tr></tbody>
        </table>
    </div>
</div>

<!-- Modal PDF Billet -->
<div id="ticket-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:12px; width:90%; max-width:500px; max-height:80vh; overflow-y:auto;">
        <div id="ticket-content"></div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn-search" onclick="html2pdf(document.getElementById('ticket-content'))">Télécharger PDF</button>
            <button class="btn-login" onclick="document.getElementById('ticket-modal').style.display='none'">Fermer</button>
        </div>
    </div>
</div>

<script>
    const db = window.supabase.createClient('https://bzlzjyktulpplftqdmvn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA');
    let stations = [];
    let currentUser = localStorage.getItem('monrail_user');
    
    if(currentUser) document.getElementById('auth-btn').innerText = currentUser;

    async function init() {
        document.getElementById('date-input').valueAsDate = new Date();
        const { data } = await db.from('stations').select('*');
        stations = data || [];
        setupAutocomplete('dep-input', 'dep-list');
        setupAutocomplete('arr-input', 'arr-list');
        setupAutocomplete('board-input', 'board-list', loadBoard);
    }
    init();

    function setupAutocomplete(inputId, listId, callback) {
        const input = document.getElementById(inputId);
        const list = document.getElementById(listId);
        input.addEventListener('input', () => {
            const val = input.value.toLowerCase();
            list.innerHTML = '';
            if(!val) return list.style.display = 'none';
            const matches = stations.filter(s => s.name.toLowerCase().includes(val));
            list.style.display = matches.length ? 'block' : 'none';
            matches.forEach(s => {
                const div = document.createElement('div'); div.innerText = s.name;
                div.onclick = () => { 
                    input.value = s.name; input.dataset.id = s.id; list.style.display = 'none'; 
                    if(callback) callback(s.id);
                };
                list.appendChild(div);
            });
        });
        document.addEventListener('click', (e) => { if(e.target !== input) list.style.display = 'none'; });
    }

    function getStationName(id) { return stations.find(s => s.id === id)?.name || 'Inconnu'; }

    async function searchTrains() {
        const depId = document.getElementById('dep-input').dataset.id;
        const arrId = document.getElementById('arr-input').dataset.id;
        const dateVal = document.getElementById('date-input').value;
        const res = document.getElementById('results-container');

        if(!depId || !arrId || !dateVal) return alert("Sélectionnez les gares dans les suggestions.");
        res.innerHTML = '<p style="text-align:center;">Recherche en cours...</p>';

        const start = new Date(dateVal); start.setHours(0,0,0,0);
        const end = new Date(dateVal); end.setHours(23,59,59,999);

        // Récupérer toutes les lignes et trajets de la journée
        const { data: lines } = await db.from('lines').select('*');
        const { data: journeys } = await db.from('journeys').select('*').gte('departure_date', start.toISOString()).lte('departure_date', end.toISOString());

        res.innerHTML = '';
        let found = false;

        journeys.forEach(j => {
            const line = lines.find(l => l.id === j.line_id);
            if(!line) return;
            
            let route = JSON.parse(line.route || '[]');
            let mods = JSON.parse(j.modified_stops || '{"added":[], "skipped":[]}');
            
            // Appliquer les modifs exceptionnelles
            route = route.filter(s => !mods.skipped.includes(s.id));
            mods.added.forEach(add => route.push(add));
            // Pour simplifier l'affichage du circuit, on trie par temps (les ajouts doivent avoir un temps valide)
            route.sort((a,b) => a.offset - b.offset); 

            const idxDep = route.findIndex(s => s.id === depId);
            const idxArr = route.findIndex(s => s.id === arrId);

            if(idxDep !== -1 && idxArr !== -1 && idxDep < idxArr) {
                found = true;
                const baseTime = new Date(j.departure_date);
                const depTime = new Date(baseTime.getTime() + (route[idxDep].offset * 60000));
                const arrTime = new Date(baseTime.getTime() + (route[idxArr].offset * 60000));
                
                // Calcul Prix
                let price = line.base_price;
                if(line.price_type === 'dynamic') {
                    const daysDiff = (baseTime - new Date()) / (1000*3600*24);
                    if(daysDiff < line.days_advance) price = line.late_price;
                }

                // Alertes
                let alertHtml = '';
                let opacity = '1';
                if(j.status === 'cancelled') { alertHtml = `<div class="alert-box">TRAIN SUPPRIMÉ : ${j.motif} - Renseignez-vous en gare.</div>`; opacity = '0.6'; }
                else if(j.status === 'delayed') alertHtml = `<div class="alert-box" style="background:#fff3cd; color:#856404; border-color:#856404;">RETARD ESTIMÉ (+${j.delay_minutes}min) : ${j.motif}</div>`;
                if(line.is_exceptional) alertHtml += `<div class="alert-box" style="background:#e3f2fd; color:#0c5460; border-color:#0c5460;">TRAJET EXCEPTIONNEL</div>`;

                // Construction Circuit Droit
                let circuitHtml = '';
                for(let i=idxDep; i<=idxArr; i++) {
                    let t = new Date(baseTime.getTime() + (route[i].offset * 60000) + (j.delay_minutes * 60000));
                    let dotClass = 'timeline-dot';
                    if(i === idxDep) dotClass += ' dot-green';
                    if(i === idxArr) dotClass += ' dot-red';
                    
                    let excep = mods.added.find(a => a.id === route[i].id) ? '<br><span style="color:var(--green); font-size:10px;">Arrêt Excep.</span>' : '';
                    circuitHtml += `<div class="timeline-stop"><div class="${dotClass}"></div>${t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>${route[i].name}${excep}</div>`;
                }

                res.innerHTML += `
                    <div class="result-card" style="opacity:${opacity}">
                        ${alertHtml}
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <span class="train-badge badge-tgv">${line.train_type} N°${line.train_number}</span>
                                <div style="margin-top:15px; display:flex; gap:20px; align-items:center;">
                                    <div><strong style="font-size:20px;">${depTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</strong> <span style="color:var(--text-muted);">${getStationName(depId)}</span></div>
                                    <div>➔</div>
                                    <div><strong style="font-size:20px;">${arrTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</strong> <span style="color:var(--text-muted);">${getStationName(arrId)}</span></div>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:24px; font-weight:800; margin-bottom:10px;">${price} €</div>
                                <button class="btn-search" style="margin:0;" onclick="bookTrain('${j.id}', ${price}, '${j.status}')" ${j.status==='cancelled'?'disabled':''}>Réserver</button>
                            </div>
                        </div>
                        <div class="timeline">${circuitHtml}</div>
                        <p style="font-size:12px; color:gray; text-align:center; margin-top:20px; margin-bottom:0;">Billet non remboursable ni échangeable.</p>
                    </div>
                `;
            }
        });

        if(!found) res.innerHTML = '<p style="text-align:center;">Aucun train trouvé pour ce trajet.</p>';
    }

    function handleAuth() {
        const nom = prompt("Création de compte obligatoire avant réservation.\nSaisissez votre Nom et Prénom :");
        if(nom) { localStorage.setItem('monrail_user', nom); currentUser = nom; document.getElementById('auth-btn').innerText = nom; }
    }

    async function bookTrain(jId, price, status) {
        if(status === 'cancelled') return;
        if(!currentUser) { alert("Vous devez vous connecter ou créer un compte pour mettre un nom sur le billet."); handleAuth(); if(!currentUser) return; }
        
        const cb = prompt(`Paiement de ${price}€\nSystème Fictif MONRail : Entrez n'importe quel numéro de carte pour valider :`);
        if(cb) {
            const { error } = await db.from('tickets').insert([{ passenger_name: currentUser, journey_id: jId }]);
            if(!error) { alert("Paiement validé ! Retrouvez le billet dans votre espace."); openTickets(); }
            else alert("Erreur : " + error.message);
        }
    }

    async function loadBoard(stationId) {
        if(!stationId) return;
        const tbody = document.getElementById('board-body');
        tbody.innerHTML = '<tr><td colspan="3">Chargement...</td></tr>';
        
        const now = new Date();
        const future = new Date(now.getTime() + (10 * 3600 * 1000));
        
        const { data: lines } = await db.from('lines').select('*');
        const { data: journeys } = await db.from('journeys').select('*').gte('departure_date', now.toISOString()).lte('departure_date', future.toISOString()).order('departure_date');

        let html = '';
        let count = 0;

        journeys.forEach(j => {
            if(count >= 10) return;
            const line = lines.find(l => l.id === j.line_id);
            if(!line) return;
            
            let route = JSON.parse(line.route || '[]');
            const idx = route.findIndex(s => s.id === stationId);
            
            if(idx !== -1) {
                const t = new Date(new Date(j.departure_date).getTime() + (route[idx].offset * 60000));
                let status = j.status === 'delayed' ? `<span style="color:#f59e0b">Retard</span>` : (j.status === 'cancelled' ? `<span style="color:red">Supprimé</span>` : `<span style="color:green">À l'heure</span>`);
                html += `<tr style="border-bottom:1px solid #334155;">
                    <td style="padding:10px;">${t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td>
                    <td style="padding:10px;">${line.train_type} N°${line.train_number}</td>
                    <td style="padding:10px;">${status}</td>
                </tr>`;
                count++;
            }
        });

        tbody.innerHTML = html || '<tr><td colspan="3">Aucun train prévu.</td></tr>';
    }

    async function openTickets() {
        if(!currentUser) return alert("Veuillez vous connecter.");
        const { data: tickets } = await db.from('tickets').select('*, journeys(departure_date, lines(*))').eq('passenger_name', currentUser);
        
        const content = document.getElementById('ticket-content');
        content.innerHTML = '<h2 style="color:var(--red); margin-top:0;">Vos Billets MONRail</h2>';
        
        if(!tickets || tickets.length === 0) content.innerHTML += '<p>Aucun billet.</p>';
        
        tickets.forEach(t => {
            const j = t.journeys;
            const d = new Date(j.departure_date);
            content.innerHTML += `
                <div style="border: 2px dashed var(--green); padding:20px; margin-bottom:15px; border-radius:8px;">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px;">
                        <strong>${j.lines.train_type} N°${j.lines.train_number}</strong>
                        <span>${d.toLocaleDateString()}</span>
                    </div>
                    <p><strong>Passager :</strong> ${t.passenger_name.toUpperCase()}</p>
                    <p style="font-size:12px; color:gray; text-align:center; margin-top:20px;">Billet nominatif, non remboursable, non échangeable.<br>Généré le ${new Date(t.booking_date).toLocaleDateString()}</p>
                </div>
            `;
        });
        document.getElementById('ticket-modal').style.display = 'flex';
    }
</script>
</body>
</html>
