<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONRail - Réservation</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header>
    <a href="#" class="logo">MON<span>Rail</span><span class="dot">.</span></a>
    <div class="nav-links">
        <a href="#horaires-gare">Horaires en gare</a>
        <a onclick="openTicketsModal()">Vos billets</a>
    </div>
    <div class="nav-actions">
        <button class="btn-login" id="auth-btn" onclick="handleAuth()">Se connecter</button>
    </div>
</header>

<div class="container">
    <h1 class="hero-title">Trouvez votre prochain trajet.</h1>

    <div class="search-widget">
        <div class="search-input-group">
            <input type="text" id="dep-input" placeholder="Gare de départ" onkeyup="searchStation(this, 'dep-list')">
            <div id="dep-list" class="autocomplete-list"></div>
        </div>
        <div class="search-input-group">
            <input type="text" id="arr-input" placeholder="Gare d'arrivée" onkeyup="searchStation(this, 'arr-list')">
            <div id="arr-list" class="autocomplete-list"></div>
        </div>
        <div class="search-input-group" style="flex: 0.5;">
            <input type="date" id="date-input">
        </div>
        <button class="btn-search" onclick="searchTrains()">Rechercher</button>
    </div>

    <div id="results-header" class="section-title"></div>
    <div id="results-container"></div>

    <!-- Tableau Horaires en Gare -->
    <div class="board-container" id="horaires-gare">
        <div class="board-header">
            <h2>Tableau d'affichage des gares</h2>
            <div style="position:relative;">
                <input type="text" id="board-input" placeholder="Rechercher une gare..." onkeyup="searchBoardStation()">
                <div id="board-list" class="autocomplete-list" style="color:black;"></div>
            </div>
        </div>
        <table class="board-table">
            <thead>
                <tr><th>Heure</th><th>Train</th><th>Statut</th></tr>
            </thead>
            <tbody id="board-body">
                <tr><td colspan="3" style="text-align:center; color:#64748B;">Sélectionnez une gare ci-dessus.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODALE VOS BILLETS -->
<div class="modal-overlay" id="tickets-modal">
    <div class="modal-content">
        <span class="modal-close" onclick="document.getElementById('tickets-modal').style.display='none'">&times;</span>
        <h2 style="margin-top:0; color:var(--primary-red);">Vos Billets MONRail</h2>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Retrouvez ici l'historique de vos réservations. Les billets sont nominatifs et non remboursables.</p>
        <div id="tickets-list-container"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bzlzjyktulpplftqdmvn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let stations = [];
    let currentUser = null;

    // Check Auth Status on load
    supabase.auth.getSession().then(({ data: { session } }) => {
        if(session) {
            currentUser = session.user;
            document.getElementById('auth-btn').innerText = "Mon Compte";
        }
    });

    async function loadStations() {
        let { data } = await supabase.from('stations').select('*');
        stations = data || [];
        document.getElementById('date-input').valueAsDate = new Date();
    }
    loadStations();

    function getStationName(id) {
        const s = stations.find(st => st.id === id);
        return s ? s.name : 'Inconnu';
    }

    function searchStation(inputEle, listId) {
        const val = inputEle.value.toLowerCase();
        const list = document.getElementById(listId);
        list.innerHTML = '';
        if (!val) { list.style.display = 'none'; return; }
        
        const matches = stations.filter(s => s.name.toLowerCase().includes(val));
        if(matches.length > 0) list.style.display = 'block'; else list.style.display = 'none';

        matches.forEach(s => {
            const div = document.createElement('div');
            div.innerText = s.name;
            div.onclick = () => {
                inputEle.value = s.name;
                inputEle.dataset.id = s.id;
                list.style.display = 'none';
            };
            list.appendChild(div);
        });
    }

    async function searchTrains() {
        const depInput = document.getElementById('dep-input');
        const arrInput = document.getElementById('arr-input');
        const depId = depInput.dataset.id;
        const arrId = arrInput.dataset.id;
        if (!depId || !arrId) return alert('Sélectionnez les gares dans la liste.');

        document.getElementById('results-header').innerHTML = `Résultats : ${depInput.value} ➔ ${arrInput.value}`;
        const resContainer = document.getElementById('results-container');
        resContainer.innerHTML = '<p>Recherche sécurisée...</p>';
        
        // Fetch all non-cancelled journeys
        let { data } = await supabase.from('journeys').select('*, lines(*)').neq('status', 'cancelled');

        resContainer.innerHTML = '';
        if(data && data.length > 0) {
            data.forEach((journey) => {
                let badgeClass = 'badge-tgv';
                if(journey.lines.train_type.includes('TER')) badgeClass = 'badge-ter';
                if(journey.lines.train_type.includes('CITÉ')) badgeClass = 'badge-cite';

                const depDate = new Date(journey.departure_date);
                const arrDate = new Date(depDate.getTime() + (90 * 60000));
                let delayInfo = journey.status === 'delayed' ? `<span style="color:#F59E0B; font-weight:bold;">(+${journey.delay_minutes} min)</span>` : '';

                resContainer.innerHTML += `
                    <div class="result-card">
                        <div class="result-card-header">
                            <div class="train-badge ${badgeClass}">${journey.lines.train_type} <br><small>N°${journey.lines.train_number}</small></div>
                            <div class="journey-times">
                                <div class="time-row"><span class="time-val">${depDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span><span class="station-val">${depInput.value} ${delayInfo}</span></div>
                                <div class="time-row"><span class="time-val">${arrDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span><span class="station-val">${arrInput.value}</span></div>
                            </div>
                            <div class="price-block">
                                <span class="price-val">${journey.lines.base_price} €</span>
                                <button class="btn-book" onclick="bookTrain('${journey.id}', '${depId}', '${arrId}', ${journey.lines.base_price})">Réserver</button>
                            </div>
                        </div>
                        
                        <!-- Ligne de circuit Droit -->
                        <div class="timeline-track">
                            <div class="track-stop"><div class="track-dot"></div>DÉPART<br>${depInput.value}</div>
                            <div class="track-stop"><div class="track-dot" style="border-color:#CBD5E1; background:#F8FAFC;"></div>Passage<br>En transit</div>
                            <div class="track-stop"><div class="track-dot end"></div>ARRIVÉE<br>${arrInput.value}</div>
                        </div>
                    </div>
                `;
            });
        } else {
            resContainer.innerHTML = '<p>Aucun train programmé.</p>';
        }
    }

    async function handleAuth() {
        if(!currentUser) {
            await supabase.auth.signInWithOAuth({ provider: 'github' });
        } else {
            alert("Vous êtes déjà connecté.");
        }
    }

    // NOUVEAU : Sauvegarde du billet dans Supabase
    async function bookTrain(journeyId, depId, arrId, price) {
        if (!currentUser) {
            alert('Vous devez obligatoirement vous connecter pour associer un nom au billet.');
            handleAuth();
            return;
        }
        
        const numCB = prompt("Paiement MONRail\nMontant : " + price + "€\nEntrez votre numéro de carte (Système Fictif) :");
        if(numCB) {
            // Insertion dans la BDD Supabase
            const { error } = await supabase.from('tickets').insert([{
                user_id: currentUser.id,
                passenger_name: currentUser.email, // ou un prompt pour demander le nom
                journey_id: journeyId,
                departure_station_id: depId,
                arrival_station_id: arrId,
                price_paid: price
            }]);

            if(error) {
                alert("Erreur lors de l'émission du billet : " + error.message);
            } else {
                alert("Paiement validé ! Retrouvez votre billet dans l'espace 'Vos billets'.");
                openTicketsModal(); // Ouvre directement la modale
            }
        }
    }

    // NOUVEAU : Récupération des billets depuis Supabase
    async function openTicketsModal() {
        if(!currentUser) return alert("Veuillez vous connecter d'abord.");
        
        const modal = document.getElementById('tickets-modal');
        const container = document.getElementById('tickets-list-container');
        modal.style.display = 'flex';
        container.innerHTML = '<p>Chargement de vos billets...</p>';

        const { data, error } = await supabase.from('tickets')
            .select('*, journeys(departure_date, lines(train_type, train_number))')
            .eq('user_id', currentUser.id)
            .order('booking_date', { ascending: false });

        if(error) return container.innerHTML = '<p>Erreur de chargement.</p>';
        
        container.innerHTML = '';
        if(data.length === 0) return container.innerHTML = '<p>Vous n\'avez aucun billet.</p>';

        data.forEach(ticket => {
            const depName = getStationName(ticket.departure_station_id);
            const arrName = getStationName(ticket.arrival_station_id);
            const depDate = new Date(ticket.journeys.departure_date);
            
            // Format Billet pour PDF
            const ticketDivId = `ticket-${ticket.id}`;
            container.innerHTML += `
                <div class="result-card" id="${ticketDivId}" style="border: 2px solid var(--primary-green); padding:20px;">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px;">
                        <strong>MONRail - ${ticket.journeys.lines.train_type} N°${ticket.journeys.lines.train_number}</strong>
                        <span style="color:gray;">${depDate.toLocaleDateString()}</span>
                    </div>
                    <h3 style="margin:5px 0;">${depName} ➔ ${arrName}</h3>
                    <p style="margin:5px 0;"><strong>Départ à :</strong> ${depDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                    <p style="margin:5px 0;"><strong>Passager :</strong> ${ticket.passenger_name.toUpperCase()}</p>
                    <p style="font-size:12px; color:gray; text-align:center; margin-top:15px;">Billet Non Remboursable / Non Échangeable<br>Généré le ${new Date(ticket.booking_date).toLocaleDateString()}</p>
                </div>
                <button class="btn-book" style="margin-bottom:25px;" onclick="downloadSpecificPDF('${ticketDivId}')">Télécharger PDF</button>
            `;
        });
    }

    function downloadSpecificPDF(elementId) {
        html2pdf(document.getElementById(elementId));
    }

    // Horaires Gare
    function searchBoardStation() {
        searchStation(document.getElementById('board-input'), 'board-list');
        const list = document.getElementById('board-list');
        list.querySelectorAll('div').forEach(div => {
            const oldClick = div.onclick;
            div.onclick = () => { oldClick(); loadStationBoard(); }
        });
    }

    async function loadStationBoard() {
        const tbody = document.getElementById('board-body');
        let { data } = await supabase.from('journeys').select('*, lines(*)').limit(5);
        tbody.innerHTML = '';
        if(data) {
            data.forEach((journey, i) => {
                const time = new Date(journey.departure_date);
                time.setMinutes(time.getMinutes() + (i * 15));
                let status = journey.status === 'delayed' ? `<span style="color:#F59E0B">Retard</span>` : (journey.status === 'cancelled' ? '<span style="color:red">Supprimé</span>' : '<span style="color:green">À l\'heure</span>');
                tbody.innerHTML += `<tr><td>${time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${journey.lines.train_type}</td><td>${status}</td></tr>`;
            });
        }
    }
</script>
</body>
</html>
