<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MONRail</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<header>
    <a href="#" class="logo">MON<span>Rail</span></a>
    <div>
        <button onclick="handleAuth()" id="auth-btn">Connexion</button>
        <button onclick="showTickets()">Vos Billets (PDF)</button>
    </div>
</header>

<div class="container">
    <div class="card" style="display:flex; gap:10px;">
        <select id="dep"></select> <select id="arr"></select> <input type="date" id="date">
        <button onclick="searchTrains()">Rechercher</button>
    </div>

    <div id="results"></div>

    <div class="card">
        <h3>Horaires en gare (10 prochains max)</h3>
        <select id="board-st" onchange="loadBoard()"></select>
        <div id="board-res"></div>
    </div>
</div>

<div id="pdf-zone" style="display:none; padding:20px; background:white; border:2px solid var(--green);"></div>

<script>
    const supabase = supabase.createClient('https://bzlzjyktulpplftqdmvn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA');
    let stations = [];
    let user = localStorage.getItem('monrail_user');
    if(user) document.getElementById('auth-btn').innerText = user;

    async function init() {
        document.getElementById('date').valueAsDate = new Date();
        const {data} = await supabase.from('stations').select('*');
        stations = data || [];
        const opts = '<option value="">Choisir...</option>' + stations.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        document.getElementById('dep').innerHTML = opts;
        document.getElementById('arr').innerHTML = opts;
        document.getElementById('board-st').innerHTML = opts;
    }
    init();

    async function searchTrains() {
        const dep = document.getElementById('dep').value;
        const arr = document.getElementById('arr').value;
        const dStr = document.getElementById('date').value;
        if(!dep || !arr || !dStr) return;
        
        const start = new Date(dStr); start.setHours(0,0,0,0);
        const end = new Date(dStr); end.setHours(23,59,59,999);

        const {data: lines} = await supabase.from('lines').select('*');
        const {data: journeys} = await supabase.from('journeys').select('*').gte('departure_date', start.toISOString()).lte('departure_date', end.toISOString());

        const res = document.getElementById('results');
        res.innerHTML = '';

        journeys.forEach(j => {
            const line = lines.find(l => l.id === j.line_id);
            const stops = JSON.parse(line.stops);
            
            // Vérifie si la ligne dessert le départ puis l'arrivée
            const idxDep = stops.findIndex(s => s.id === dep);
            const idxArr = stops.findIndex(s => s.id === arr);
            
            if(idxDep !== -1 && idxArr !== -1 && idxDep < idxArr) {
                const baseTime = new Date(j.departure_date);
                const depTime = new Date(baseTime.getTime() + (stops[idxDep].offset * 60000));
                const arrTime = new Date(baseTime.getTime() + (stops[idxArr].offset * 60000));
                
                // Prix dynamique
                let price = line.base_price;
                const daysDiff = (baseTime - new Date()) / (1000*3600*24);
                if(line.price_type === 'dynamic' && daysDiff < line.days_advance) price = line.late_price;

                // Alertes Motif
                let alertHtml = '';
                if(j.status === 'cancelled') alertHtml = `<div class="alert">ANNULÉ : ${j.motif}</div>`;
                if(j.status === 'delayed') alertHtml = `<div class="alert">RETARD +${j.delay_minutes}m : ${j.motif}</div>`;

                // Circuit Droit
                let circuit = '';
                for(let i=idxDep; i<=idxArr; i++) {
                    let t = new Date(baseTime.getTime() + (stops[i].offset * 60000));
                    circuit += `<div class="stop"><div class="dot"></div>${t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>${stops[i].name}</div>`;
                }

                res.innerHTML += `
                    <div class="card" style="${j.status==='cancelled'?'opacity:0.5':''}">
                        ${alertHtml}
                        <div style="display:flex; justify-content:space-between;">
                            <div>
                                <b>${line.train_type} N°${line.train_number}</b> ${line.is_exceptional ? '(Exceptionnel)' : ''}<br>
                                <h2>${depTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ➔ ${arrTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</h2>
                            </div>
                            <div style="text-align:right;">
                                <h2>${price} €</h2>
                                <button onclick="book('${j.id}', ${price})">Réserver</button>
                            </div>
                        </div>
                        <p style="font-size:12px; color:gray;">Billet non remboursable, non échangeable.</p>
                        <div class="timeline">${circuit}</div>
                    </div>
                `;
            }
        });
        if(res.innerHTML === '') res.innerHTML = '<p>Aucun trajet trouvé.</p>';
    }

    function handleAuth() {
        const nom = prompt("Créer un compte - Entrez votre nom complet :");
        if(nom) { localStorage.setItem('monrail_user', nom); user = nom; document.getElementById('auth-btn').innerText = nom; }
    }

    async function book(jId, price) {
        if(!user) return alert("Vous devez vous connecter ou créer un compte avant de payer.");
        if(prompt(`Paiement Fictif de ${price}€ - Entrez votre N° de carte :`)) {
            await supabase.from('tickets').insert([{passenger_name: user, journey_id: jId, price_paid: price}]);
            alert("Réservation confirmée !");
        }
    }

    async function loadBoard() {
        const st = document.getElementById('board-st').value;
        const {data: lines} = await supabase.from('lines').select('*');
        const {data: journeys} = await supabase.from('journeys').select('*').gte('departure_date', new Date().toISOString());
        
        let html = '';
        let count = 0;
        journeys.forEach(j => {
            const line = lines.find(l => l.id === j.line_id);
            const stops = JSON.parse(line.stops);
            const stop = stops.find(s => s.id === st);
            if(stop && count < 10) {
                const t = new Date(new Date(j.departure_date).getTime() + (stop.offset * 60000));
                html += `<div style="padding:10px; border-bottom:1px solid #eee;">${t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} - ${line.train_type} N°${line.train_number} - ${j.status==='delayed'?'Retard':(j.status==='cancelled'?'Supprimé':'À l\'heure')}</div>`;
                count++;
            }
        });
        document.getElementById('board-res').innerHTML = html;
    }

    async function showTickets() {
        if(!user) return alert("Connectez-vous.");
        const {data} = await supabase.from('tickets').select('*, journeys(departure_date, lines(train_type, train_number))').eq('passenger_name', user);
        
        const zone = document.getElementById('pdf-zone');
        zone.style.display = 'block';
        zone.innerHTML = '<h2>Vos Billets MONRail</h2>';
        data.forEach(t => {
            zone.innerHTML += `<div style="margin-bottom:20px; border:1px dashed gray; padding:10px;">
                <b>${t.passenger_name}</b><br>
                ${t.journeys.lines.train_type} N°${t.journeys.lines.train_number} - Date: ${new Date(t.journeys.departure_date).toLocaleString()}<br>
                <i>Billet strictement personnel</i>
            </div>`;
        });
        zone.innerHTML += `<button onclick="html2pdf(document.getElementById('pdf-zone'))">Télécharger PDF</button> <button onclick="document.getElementById('pdf-zone').style.display='none'">Fermer</button>`;
    }
</script>
</body>
</html>
