<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONRail - Espace Agent</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header style="border-bottom: 3px solid var(--primary-green);">
    <a href="#" class="logo">MON<span>Rail</span><span class="dot">.</span> <span style="font-size:14px; color:var(--text-muted); font-weight:600; margin-left:10px;">ESPACE AGENT</span></a>
</header>

<div class="container" style="max-width: 1200px;">
    <div class="admin-layout">
        
        <div style="flex: 1; min-width:300px;">
            <div class="admin-card">
                <h2>1. Infrastructure (Lignes & Gares)</h2>
                <input type="text" id="new-station-name" class="input-admin" placeholder="Nom d'une nouvelle gare">
                <button class="btn-admin" onclick="addStation()" style="margin-bottom:20px;">Ajouter la gare</button>
                
                <select id="train-type" class="input-admin">
                    <option value="MONRail TGV">MONRail TGV</option>
                    <option value="MONRail TER">MONRail TER</option>
                    <option value="MONRail CITÉ">MONRail CITÉ</option>
                </select>
                <input type="number" id="base-price" class="input-admin" placeholder="Prix fixe de la ligne (€)">
                <button class="btn-admin" style="background:var(--primary-green);" onclick="createLine()">Générer Modèle de Ligne</button>
            </div>
        </div>

        <div style="flex: 1; min-width:300px;">
            <div class="admin-card" style="border: 2px solid var(--primary-green);">
                <h2 style="color:var(--primary-green);">2. Planifier un départ</h2>
                <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px;">Sélectionnez une ligne pour qu'elle apparaisse chez les clients.</p>
                
                <select id="select-line-plan" class="input-admin"></select>
                <input type="datetime-local" id="plan-date" class="input-admin">
                <button class="btn-admin" style="background:var(--primary-green);" onclick="planJourney()">Mettre en circulation</button>
            </div>
        </div>

        <div style="flex: 1; min-width:300px;">
            <div class="admin-card">
                <h2>3. Guichet (Réservation Manuelle)</h2>
                
                <input type="text" id="manual-passenger" class="input-admin" placeholder="Email du passager">
                <input type="text" id="manual-journey-id" class="input-admin" placeholder="ID du Trajet (UUID)">
                <button class="btn-admin" onclick="manualBooking()">Éditer le billet</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bzlzjyktulpplftqdmvn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function initAdmin() {
        const { data: lines, error } = await supabase.from('lines').select('*');
        if(error) return console.error("Erreur chargement lignes:", error);
        
        const selectPlan = document.getElementById('select-line-plan');
        if(lines) {
            lines.forEach(line => {
                const opt = document.createElement('option');
                opt.value = line.id;
                opt.innerText = `${line.train_type} N°${line.train_number} - ${line.base_price}€`;
                selectPlan.appendChild(opt);
            });
        }
    }
    initAdmin();

    async function addStation() {
        const name = document.getElementById('new-station-name').value;
        if(!name) return alert('Saisissez un nom de gare.');
        const { error } = await supabase.from('stations').insert([{ name: name }]);
        if (error) alert("Erreur: " + error.message); else { alert('Gare ajoutée !'); location.reload(); }
    }

    async function createLine() {
        const type = document.getElementById('train-type').value;
        const price = document.getElementById('base-price').value;
        if(!price) return alert('Saisissez un prix.');
        const trainNumber = Math.floor(100000 + Math.random() * 900000).toString();
        const { error } = await supabase.from('lines').insert([{ train_number: trainNumber, train_type: type, base_price: price }]);
        if (error) alert("Erreur: " + error.message); else { alert('Ligne créée !'); location.reload(); }
    }
    
    async function planJourney() {
        const lineId = document.getElementById('select-line-plan').value;
        const date = document.getElementById('plan-date').value;
        if(!lineId || !date) return alert("Sélectionnez une ligne et une date.");

        const { error } = await supabase.from('journeys').insert([{ line_id: lineId, departure_date: date, status: 'on_time' }]);
        if (error) alert("Erreur : " + error.message); else alert("Train mis en circulation avec succès !");
    }

    async function manualBooking() {
        const passenger = document.getElementById('manual-passenger').value;
        const journeyId = document.getElementById('manual-journey-id').value;
        if(!passenger || !journeyId) return alert("Email et ID Trajet requis.");

        const { error } = await supabase.from('tickets').insert([{ passenger_name: passenger, journey_id: journeyId, price_paid: 0 }]);
        if (error) alert("Erreur : " + error.message); else alert("Billet validé en base de données.");
    }
</script>
</body>
</html>
