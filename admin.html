<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONRail - Centre de Contrôle</title>
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header style="border-bottom: 2px solid var(--primary-red);">
    <a href="#" class="logo">
        MON<span>Rail</span> <span style="color:var(--text-muted); font-size:14px; font-weight:600; margin-left:10px; background:#F1F5F9; padding:4px 8px; border-radius:6px;">CENTRE DE CONTRÔLE</span>
    </a>
</header>

<div class="container" style="max-width: 1200px;">
    
    <div class="admin-layout">
        <!-- Barre latérale -->
        <div class="admin-sidebar">
            <div class="admin-card">
                <h2>Réseau Ferré</h2>
                <input type="text" id="new-station-name" class="input-admin" placeholder="Nom de la nouvelle gare">
                <button class="btn-admin" onclick="addStation()">Ajouter la gare</button>
            </div>

            <div class="admin-card">
                <h2>Création Ligne</h2>
                <select id="train-type" class="input-admin">
                    <option value="MONRail TGV">MONRail TGV</option>
                    <option value="MONRail TER">MONRail TER</option>
                    <option value="MONRail CITÉ">MONRail CITÉ</option>
                </select>
                <input type="number" id="base-price" class="input-admin" placeholder="Prix de base (€)">
                <button class="btn-admin" style="background:var(--primary-green);" onclick="createLine()">Générer Ligne</button>
            </div>
        </div>

        <!-- Contenu Principal -->
        <div class="admin-content">
            <div class="admin-card" style="border: 2px solid #FFE4E6;">
                <h2 style="color:var(--primary-red); display:flex; align-items:center; gap:10px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Gestion de Crise & Trafic
                </h2>
                <p style="color:var(--text-muted); margin-bottom:20px; font-weight:500;">Modifiez l'état des trains en temps réel. La synchronisation avec l'application client (Horaires en gare et recherche) est instantanée.</p>
                
                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <input type="text" id="journey-id" class="input-admin" style="margin:0; flex:1;" placeholder="ID du trajet (UUID Supabase)">
                    <input type="number" id="delay-time" class="input-admin" style="margin:0; width:150px;" placeholder="Minutes">
                </div>
                
                <div style="display:flex; gap:15px;">
                    <button class="btn-admin" style="background:var(--primary-red);" onclick="cancelJourney()">Supprimer le train</button>
                    <button class="btn-admin" style="background:#F59E0B;" onclick="delayJourney()">Appliquer Retard</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bzlzjyktulpplftqdmvn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function addStation() {
        const name = document.getElementById('new-station-name').value;
        if(!name) return alert('Veuillez saisir un nom.');
        const { error } = await supabase.from('stations').insert([{ name: name }]);
        if (error) alert(error.message); else { alert('Gare ajoutée !'); document.getElementById('new-station-name').value = ''; }
    }

    async function createLine() {
        const type = document.getElementById('train-type').value;
        const price = document.getElementById('base-price').value;
        if(!price) return alert('Veuillez définir un prix.');

        const trainNumber = Math.floor(100000 + Math.random() * 900000).toString();
        const { error } = await supabase.from('lines').insert([{ train_number: trainNumber, train_type: type, base_price: price }]);
        if (error) alert(error.message); else alert('Ligne ' + type + ' créée. N°: ' + trainNumber);
    }
    
    async function cancelJourney() {
        const journeyId = document.getElementById('journey-id').value;
        if(!journeyId) return alert('ID manquant.');
        await supabase.from('journeys').update({ status: 'cancelled' }).eq('id', journeyId);
        alert("Train supprimé. Les tableaux d'affichage sont à jour.");
    }

    async function delayJourney() {
        const journeyId = document.getElementById('journey-id').value;
        const delay = document.getElementById('delay-time').value;
        if(!journeyId || !delay) return alert('ID ou minutes manquants.');
        await supabase.from('journeys').update({ status: 'delayed', delay_minutes: parseInt(delay) }).eq('id', journeyId);
        alert(`Retard de ${delay}min appliqué au réseau.`);
    }
</script>
</body>
</html>
