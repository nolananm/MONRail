<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MONRail - Gestion</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
    <a href="#" class="logo">MON<span>Rail</span> Administrateur</a>
</header>
<div class="container">
    <div class="card">
        <h3>1. Ajouter une Gare</h3>
        <input type="text" id="new-station" placeholder="Nom de la gare">
        <button onclick="addStation()">Ajouter</button>
    </div>

    <div class="card">
        <h3>2. Créer une Ligne (Modèle)</h3>
        <select id="l-type"><option>MONRail CITÉ</option><option>MONRail TGV</option><option>MONRail TER</option></select>
        <label><input type="checkbox" id="l-excep"> Ligne exceptionnelle (1 seule fois)</label><br><br>
        
        <h4>Tarification Dynamique</h4>
        <input type="number" id="l-price1" placeholder="Prix de base (€)">
        <input type="number" id="l-days" placeholder="Jours avant départ pour changement">
        <input type="number" id="l-price2" placeholder="Prix à l'approche (€)"><br><br>
        
        <h4>Gares desservies (Dans l'ordre)</h4>
        <div id="l-stops"></div>
        <select id="s-station"></select> <input type="number" id="s-time" placeholder="Min depuis départ">
        <button onclick="addStopToLine()">Ajouter cet arrêt</button><br><br>
        <button onclick="createLine()" style="width:100%;">Générer Ligne (Numéro Auto)</button>
    </div>

    <div class="card">
        <h3>3. Calendrier de Fréquence</h3>
        <select id="p-line"></select> <input type="date" id="p-start"> au <input type="date" id="p-end">
        <input type="time" id="p-time">
        <p>Jours : <input type="checkbox" class="days" value="1" checked>L <input type="checkbox" class="days" value="2" checked>M <input type="checkbox" class="days" value="3" checked>M <input type="checkbox" class="days" value="4" checked>J <input type="checkbox" class="days" value="5" checked>V <input type="checkbox" class="days" value="6" checked>S <input type="checkbox" class="days" value="0" checked>D</p>
        <button onclick="schedule()">Programmer ces trajets</button>
    </div>

    <div class="card">
        <h3 style="color:var(--red);">4. Circulation & Modifications</h3>
        <select id="m-journey"></select><br><br>
        <input type="text" id="m-motif" placeholder="Motif (ex: Panne)">
        <input type="number" id="m-delay" placeholder="Retard (min)">
        <button onclick="updateJourney('delayed')">Retarder</button>
        <button class="btn-red" onclick="updateJourney('cancelled')">Annuler</button><br><br>
        
        <h4>Réservation Manuelle (Guichet)</h4>
        <input type="text" id="g-nom" placeholder="Nom du client">
        <button onclick="manualBooking()">Émettre Billet</button>
    </div>
</div>

<script>
    const supabase = supabase.createClient('https://bzlzjyktulpplftqdmvn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA');
    let stations = [], stopsDraft = [];

    async function loadData() {
        const {data: st} = await supabase.from('stations').select('*');
        stations = st || [];
        document.getElementById('s-station').innerHTML = stations.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        
        const {data: ln} = await supabase.from('lines').select('*');
        document.getElementById('p-line').innerHTML = (ln||[]).map(l => `<option value="${l.id}">${l.train_type} N°${l.train_number}</option>`).join('');
        
        const {data: jn} = await supabase.from('journeys').select('*, lines(*)').gte('departure_date', new Date().toISOString());
        document.getElementById('m-journey').innerHTML = (jn||[]).map(j => `<option value="${j.id}">${new Date(j.departure_date).toLocaleString()} - N°${j.lines.train_number}</option>`).join('');
    }
    loadData();

    async function addStation() {
        await supabase.from('stations').insert([{name: document.getElementById('new-station').value}]);
        alert("Gare ajoutée"); loadData();
    }

    function addStopToLine() {
        const id = document.getElementById('s-station').value;
        const name = stations.find(s=>s.id===id).name;
        const min = document.getElementById('s-time').value;
        stopsDraft.push({id, name, offset: parseInt(min)});
        document.getElementById('l-stops').innerHTML += `<div>${name} (+${min}m)</div>`;
    }

    async function createLine() {
        const num = Math.floor(100000 + Math.random() * 900000).toString();
        await supabase.from('lines').insert([{
            train_number: num, train_type: document.getElementById('l-type').value,
            is_exceptional: document.getElementById('l-excep').checked,
            base_price: document.getElementById('l-price1').value,
            days_advance: document.getElementById('l-days').value || 0,
            late_price: document.getElementById('l-price2').value || 0,
            stops: JSON.stringify(stopsDraft)
        }]);
        alert("Ligne créée N°" + num); stopsDraft = []; loadData();
    }

    async function schedule() {
        const line = document.getElementById('p-line').value;
        const start = new Date(document.getElementById('p-start').value);
        const end = new Date(document.getElementById('p-end').value);
        const time = document.getElementById('p-time').value.split(':');
        const days = Array.from(document.querySelectorAll('.days:checked')).map(cb=>parseInt(cb.value));
        
        let inserts = [];
        for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) {
            if(days.includes(d.getDay())) {
                let dep = new Date(d); dep.setHours(time[0], time[1], 0);
                inserts.push({line_id: line, departure_date: dep.toISOString()});
            }
        }
        await supabase.from('journeys').insert(inserts);
        alert(inserts.length + " trajets programmés."); loadData();
    }

    async function updateJourney(status) {
        const id = document.getElementById('m-journey').value;
        const delay = document.getElementById('m-delay').value || 0;
        const motif = document.getElementById('m-motif').value;
        await supabase.from('journeys').update({status, delay_minutes: delay, motif}).eq('id', id);
        alert("Clientèle prévenue.");
    }

    async function manualBooking() {
        const nom = document.getElementById('g-nom').value;
        const jId = document.getElementById('m-journey').value;
        await supabase.from('tickets').insert([{passenger_name: nom, journey_id: jId, price_paid: 0}]);
        alert("Billet émis pour " + nom);
    }
</script>
</body>
</html>
