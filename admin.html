<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MONRail - Gestion Centrale</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .row { display: flex; gap: 15px; margin-bottom: 15px; } .col { flex: 1; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .stop-item { display:flex; justify-content:space-between; background:#f8f9fa; padding:10px; border-radius:6px; margin-bottom:5px; border:1px solid #e2e5ec; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">MON<span>Rail</span> <small style="color:var(--text-muted); font-size:14px; margin-left:10px;">GESTION</small></a>
</header>

<div class="container">
    <div class="row">
        <!-- GARES & LIGNES -->
        <div class="col admin-card">
            <h2 style="margin-top:0;">1. Gares & Lignes (Modèles)</h2>
            <div style="display:flex; gap:10px; margin-bottom:30px;">
                <input type="text" id="new-station" class="admin-input" style="margin:0;" placeholder="Nouvelle gare...">
                <button class="btn-admin" onclick="addStation()">Ajouter</button>
            </div>

            <label>Créer un modèle de Ligne</label>
            <select id="l-type" class="admin-input"><option>MONRail TGV</option><option>MONRail TER</option><option>MONRail CITÉ</option></select>
            
            <div class="row" style="margin-bottom:0;">
                <div class="col"><input type="number" id="l-price" class="admin-input" placeholder="Prix de base (€)"></div>
                <div class="col"><select id="l-price-type" class="admin-input"><option value="fixed">Prix Fixe</option><option value="dynamic">Prix Dynamique</option></select></div>
            </div>
            <div class="row" style="margin-bottom:0;">
                <div class="col"><input type="number" id="l-days" class="admin-input" placeholder="Jours avant départ (Dyn)"></div>
                <div class="col"><input type="number" id="l-late" class="admin-input" placeholder="Prix dernière minute (€)"></div>
            </div>
            <label style="font-weight:normal; margin-bottom:15px;"><input type="checkbox" id="l-excep"> Trajet Exceptionnel (1 seule fois)</label>

            <div style="background:#f4f5f9; padding:15px; border-radius:8px; margin-bottom:15px;">
                <label>Parcours (Ajouter les gares dans l'ordre)</label>
                <div id="route-list" style="margin-bottom:10px;"></div>
                <div style="display:flex; gap:10px;">
                    <select id="r-station" class="admin-input" style="margin:0;"></select>
                    <input type="number" id="r-time" class="admin-input" style="margin:0; width:100px;" placeholder="+ Min">
                    <button class="btn-admin" style="background:var(--green);" onclick="addRouteStop()">Ajouter</button>
                </div>
            </div>
            <button class="btn-admin" style="width:100%; background:var(--green);" onclick="createLine()">Générer Ligne (N° Auto)</button>
        </div>

        <!-- CALENDRIER -->
        <div class="col admin-card">
            <h2 style="margin-top:0;">2. Programmation Calendrier</h2>
            <label>Sélectionner la Ligne</label>
            <select id="p-line" class="admin-input"></select>
            
            <div class="row" style="margin-bottom:0;">
                <div class="col"><label>Du :</label><input type="date" id="p-start" class="admin-input"></div>
                <div class="col"><label>Au :</label><input type="date" id="p-end" class="admin-input"></div>
            </div>
            <label>Heure du premier départ :</label>
            <input type="time" id="p-time" class="admin-input">

            <label>Fréquence automatique</label>
            <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="1" checked> L</label>
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="2" checked> M</label>
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="3" checked> M</label>
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="4" checked> J</label>
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="5" checked> V</label>
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="6" checked> S</label>
                <label style="font-weight:normal;"><input type="checkbox" class="days" value="0" checked> D</label>
            </div>
            <button class="btn-admin" style="width:100%; background:var(--green);" onclick="scheduleJourneys()">Mettre en circulation</button>
        </div>
    </div>

    <!-- MODIFICATIONS & GUICHET -->
    <div class="admin-card">
        <h2 style="margin-top:0; color:var(--red);">3. Aléas, Arrêts Exceptionnels & Guichet</h2>
        <label>Sélectionner un train programmé aujourd'hui ou dans le futur :</label>
        <select id="m-journey" class="admin-input"></select>

        <div class="row">
            <div class="col" style="background:#ffebee; padding:15px; border-radius:8px;">
                <h3 style="margin-top:0; font-size:16px;">Retard / Suppression</h3>
                <input type="text" id="m-motif" class="admin-input" placeholder="Motif visible par le client">
                <input type="number" id="m-delay" class="admin-input" placeholder="Minutes de retard (0 si suppression)">
                <div style="display:flex; gap:10px;">
                    <button class="btn-admin" style="background:#f59e0b;" onclick="updateJourney('delayed')">Retarder</button>
                    <button class="btn-admin" style="background:var(--red);" onclick="updateJourney('cancelled')">Supprimer</button>
                </div>
            </div>

            <div class="col" style="background:#e8f5e9; padding:15px; border-radius:8px;">
                <h3 style="margin-top:0; font-size:16px;">Arrêt Exceptionnel</h3>
                <select id="m-excep-station" class="admin-input"></select>
                <input type="number" id="m-excep-time" class="admin-input" placeholder="Temps depuis départ initial (Min)">
                <div style="display:flex; gap:10px;">
                    <button class="btn-admin" style="background:var(--text-dark);" onclick="modifyStop('skipped')">Supprimer l'arrêt</button>
                    <button class="btn-admin" style="background:var(--green);" onclick="modifyStop('added')">Ajouter l'arrêt</button>
                </div>
            </div>

            <div class="col" style="background:#f8f9fa; padding:15px; border-radius:8px;">
                <h3 style="margin-top:0; font-size:16px;">Guichet (Billet Manuel)</h3>
                <input type="text" id="g-nom" class="admin-input" placeholder="Nom et Prénom du client">
                <button class="btn-admin" style="width:100%;" onclick="manualBooking()">Émettre Billet (Payé au guichet)</button>
            </div>
        </div>
    </div>
</div>

<script>
    const db = window.supabase.createClient('https://bzlzjyktulpplftqdmvn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6bHpqeWt0dWxwcGxmdHFkbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NDA2OTMsImV4cCI6MjEwODQxNjY5M30.d5GL-oPuYSzSeONgHpOKA0_MqE4h28srYlnfAx2ASlA');
    let stations = [], routeDraft = [];

    async function loadData() {
        const { data: st } = await db.from('stations').select('*').order('name');
        stations = st || [];
        const stOpts = stations.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        document.getElementById('r-station').innerHTML = stOpts;
        document.getElementById('m-excep-station').innerHTML = stOpts;

        const { data: ln } = await db.from('lines').select('*');
        document.getElementById('p-line').innerHTML = (ln||[]).map(l => `<option value="${l.id}">${l.train_type} N°${l.train_number}</option>`).join('');

        const { data: jn } = await db.from('journeys').select('*, lines(*)').gte('departure_date', new Date().toISOString()).order('departure_date');
        document.getElementById('m-journey').innerHTML = (jn||[]).map(j => `<option value="${j.id}">${new Date(j.departure_date).toLocaleString([],{hour:'2-digit',minute:'2-digit'})} - N°${j.lines.train_number}</option>`).join('');
    }
    loadData();

    async function addStation() {
        const name = document.getElementById('new-station').value;
        if(!name) return;
        await db.from('stations').insert([{ name }]);
        document.getElementById('new-station').value = ''; loadData(); alert("Gare enregistrée.");
    }

    function addRouteStop() {
        const id = document.getElementById('r-station').value;
        const name = stations.find(s=>s.id===id).name;
        const offset = document.getElementById('r-time').value;
        if(!offset) return alert("Saisissez les minutes depuis le départ (0 pour la première gare).");
        routeDraft.push({ id, name, offset: parseInt(offset) });
        document.getElementById('route-list').innerHTML += `<div class="stop-item"><span>${name}</span> <span>+${offset} min</span></div>`;
        document.getElementById('r-time').value = '';
    }

    async function createLine() {
        if(routeDraft.length < 2) return alert("Il faut au moins un départ et une arrivée.");
        const num = Math.floor(100000 + Math.random() * 900000).toString();
        await db.from('lines').insert([{
            train_number: num,
            train_type: document.getElementById('l-type').value,
            is_exceptional: document.getElementById('l-excep').checked,
            base_price: document.getElementById('l-price').value,
            price_type: document.getElementById('l-price-type').value,
            days_advance: document.getElementById('l-days').value || 0,
            late_price: document.getElementById('l-late').value || 0,
            route: JSON.stringify(routeDraft)
        }]);
        alert("Ligne créée N°" + num); routeDraft = []; document.getElementById('route-list').innerHTML = ''; loadData();
    }

    async function scheduleJourneys() {
        const lineId = document.getElementById('p-line').value;
        const start = new Date(document.getElementById('p-start').value);
        const end = new Date(document.getElementById('p-end').value);
        const time = document.getElementById('p-time').value.split(':');
        const days = Array.from(document.querySelectorAll('.days:checked')).map(cb=>parseInt(cb.value));
        
        let inserts = [];
        for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) {
            if(days.includes(d.getDay())) {
                let dep = new Date(d); dep.setHours(time[0], time[1], 0);
                inserts.push({ line_id: lineId, departure_date: dep.toISOString() });
            }
        }
        await db.from('journeys').insert(inserts);
        alert(inserts.length + " trajets programmés !"); loadData();
    }

    async function updateJourney(status) {
        const id = document.getElementById('m-journey').value;
        const delay = document.getElementById('m-delay').value || 0;
        const motif = document.getElementById('m-motif').value;
        await db.from('journeys').update({ status, delay_minutes: delay, motif }).eq('id', id);
        alert("Modification appliquée. Les clients sont alertés.");
    }

    async function modifyStop(action) {
        const jId = document.getElementById('m-journey').value;
        const sId = document.getElementById('m-excep-station').value;
        const offset = document.getElementById('m-excep-time').value;
        const sName = stations.find(s=>s.id===sId).name;

        const { data: j } = await db.from('journeys').select('modified_stops').eq('id', jId).single();
        let mods = JSON.parse(j.modified_stops || '{"added":[], "skipped":[]}');
        
        if(action === 'skipped') mods.skipped.push(sId);
        if(action === 'added') mods.added.push({ id: sId, name: sName, offset: parseInt(offset) });

        await db.from('journeys').update({ modified_stops: JSON.stringify(mods) }).eq('id', jId);
        alert("Arrêt exceptionnel mis à jour ! Synchronisation client ok.");
    }

    async function manualBooking() {
        const nom = document.getElementById('g-nom').value;
        const jId = document.getElementById('m-journey').value;
        if(!nom) return alert("Saisissez un nom.");
        await db.from('tickets').insert([{ passenger_name: nom, journey_id: jId }]);
        alert("Billet validé en base pour " + nom); document.getElementById('g-nom').value = '';
    }
</script>
</body>
</html>
